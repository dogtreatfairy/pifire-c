name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake gcc make pkg-config libsqlite3-dev libmosquitto-dev libcurl4-openssl-dev libsystemd-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPF_SANITIZE=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
