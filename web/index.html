<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black" gives the status bar its own solid plate and starts the web view below it. With
     "black-translucent" iOS draws a progressive blur over the top of the page to keep the clock
     legible, which is what made the header look soft however the header itself was styled. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PiFire">
<meta name="mobile-web-app-capable" content="yes">
<title>PiFire</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/uPlot.min.css">
<link rel="stylesheet" href="/style.css">
<script>
/* A Home Screen app that comes up unstyled leaves its owner no recourse but to force-quit it, so
   it checks its own work. The body is pinned by the stylesheet; if it is not pinned, the stylesheet
   did not arrive, whatever the service worker believed. Fetch it again past every cache, and if
   even that fails, say so in plain HTML rather than sitting there looking broken. */
(function () {
  /* The stylesheet pins the body to the viewport -- that is the app shell, and nothing else in the
     document does it -- and clears the user agent's margin. Either signal on its own is enough, and
     if the check cannot run we assume all is well rather than risk fighting a page that is fine. */
  function styled() {
    try {
      var cs = getComputedStyle(document.body);
      return cs.position === 'fixed' || cs.marginTop === '0px';
    } catch (e) { return true; }
  }
  function retry(n) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = '/style.css?retry=' + Date.now();
    l.onload = function () { document.documentElement.removeAttribute('data-unstyled'); };
    l.onerror = function () { if (n > 0) setTimeout(function () { retry(n - 1); }, 1500); };
    document.head.appendChild(l);
  }
  addEventListener('DOMContentLoaded', function () {
    if (styled()) return;
    document.documentElement.setAttribute('data-unstyled', '');
    retry(3);
    /* A reload is the last resort and happens once. A Home Screen app stuck in a reload loop is
       worse than one that looks wrong, because there is no address bar to escape from it. */
    setTimeout(function () {
      if (styled()) return;
      try {
        if (sessionStorage.getItem('pf_css_reload')) return;
        sessionStorage.setItem('pf_css_reload', '1');
      } catch (e) { return; }
      location.reload();
    }, 6000);
  });
})();
</script>
</head>
<body>
<div class="edge-anchor" aria-hidden="true"></div>
<header class="topbar">
  <!-- On a sub-page this takes the brand's place, exactly as a native navigation bar does. It
       lives in the header rather than in the scrolling content, so it cannot scroll away. -->
  <button class="tb-back" id="tb-back" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    <span id="tb-back-label">Back</span>
  </button>
  <!-- Two slots: what the grill is DOING on the left, how you are reaching it on the right. The
       readout carries the mode and the temperature the grill is actually at, on every page, which
       is the one number a glance is looking for. It used to show the target on Home and the
       temperature everywhere else, so the same plate in the same place meant two different things.
       The grill's name is not a reading and took the best position in the bar to say something
       that never changes. -->
  <div class="readout" id="readout"><span class="rd-mode" id="rd-mode"><span class="rd-ico" id="rd-ico"></span><span id="rd-name">—</span></span><span class="rd-val" id="rd-val" hidden></span></div>
  <div class="topbar-right"><div class="tb-inds">
    <span class="tb-ind muted" id="ind-wifi"></span>
    <span class="tb-ind" id="ind-link" title="connection"></span>
  </div><button class="bell" id="bell" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span class="badge" id="bell-badge" hidden>0</span></button></div>
</header>
<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="banner" class="banner" hidden></div>

<main id="view" class="view"></main>

<!-- Cook and Probes to the left of Home, History and Settings to its right, and Home raised in
     the middle as the end of a barrel grill: the one thing you open the app to look at, under
     the thumb, in the place a thumb reaches without moving. -->
<nav class="tabbar" aria-label="Main">
  <a href="#/cook" data-tab="cook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" /></svg><span>Cook</span></a>
  <a href="#/probes" data-tab="probes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" /></svg><span>Probes</span></a>
  <a href="#/home" data-tab="home" class="tab-home"><span class="tab-home-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3.7 9.2h16.6" /><path d="M5.2 14.6h13.6" /></svg></span><span>Home</span></a>
  <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16" /><path d="m19 9-5 5-4-4-3 3" /></svg><span>History</span></a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg><span>Settings</span></a>
</nav>

<dialog id="dlg" class="dialog"></dialog>

<script src="/uPlot.iife.min.js" defer></script>
<script type="module" src="/app.js"></script>
</body>
</html>
